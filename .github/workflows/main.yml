name: CI

on:
  push:
    branches:
      - main
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.jsx'
      - '**.md'
      - '**.mdx'
      - 'package.json'
      - 'yarn.lock'
      - '**/vercel.json'
      - '.github/workflows/main.yml'
  pull_request:
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.jsx'
      - '**.md'
      - '**.mdx'
      - 'package.json'
      - 'yarn.lock'
      - '**/vercel.json'
      - '.github/workflows/main.yml'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Yarn
        run: corepack enable && yarn set version 4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.17.0
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build turbo.json
        run: yarn gen:turbo

      - name: Verify manual deployment configuration
        run: yarn test:deployment

      - name: Build React
        run: yarn react:build

      - name: Verify static demo artifact
        run: yarn test:build:demo

      - name: Lint
        run: yarn lint:ci

      - name: Test
        if: success()
        run: yarn test:ci

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Yarn
        run: corepack enable && yarn set version 4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.17.0
          cache: 'yarn'

      - name: Install dependencies
        run: yarn
